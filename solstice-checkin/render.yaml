services:
  # 1. Express API Backend & Worker (Combined to use Free Tier)
  - type: web
    name: solstice-api
    env: node
    plan: free
    rootDir: solstice-checkin/server
    buildCommand: npm install
    startCommand: npm run start:all
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: RABBITMQ_URL
        sync: false # Set this in Render dashboard
